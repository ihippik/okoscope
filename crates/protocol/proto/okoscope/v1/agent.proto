syntax = "proto3";

package okoscope.v1;

service AgentService {
  rpc OpenSession(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  uint32 protocol_version = 1;
  oneof message {
    AgentHello hello = 10;
    EventBatch event_batch = 11;
    Heartbeat heartbeat = 12;
    ControlResult control_result = 13;
  }
}

message ServerMessage {
  uint32 protocol_version = 1;
  oneof message {
    SessionAccepted session_accepted = 10;
    BatchAcknowledgement batch_acknowledgement = 11;
    ControlMessage control = 12;
  }
}

message AgentHello {
  string agent_version = 1;
  string node_name = 2;
  string architecture = 3;
  string kernel_release = 4;
  repeated string capabilities = 5;
  DropCounters drop_counters = 6;
}

message SessionAccepted {
  string organization_id = 1;
  string cluster_id = 2;
  string agent_id = 3;
  uint32 negotiated_protocol_version = 4;
}

message Heartbeat {
  int64 sent_at_unix_nanos = 1;
  DropCounters drop_counters = 2;
}

message EventBatch {
  uint64 sequence = 1;
  repeated RuntimeEvent events = 2;
}

message BatchAcknowledgement {
  uint64 sequence = 1;
  uint32 accepted_events = 2;
}

message RuntimeEvent {
  string event_id = 1;
  int64 observed_at_unix_nanos = 2;
  uint32 schema_version = 3;
  KubernetesAttribution attribution = 4;
  ProcessIdentity process = 5;
  oneof payload {
    ProcessExec process_exec = 10;
    Syscall syscall = 11;
    NetworkConnect network_connect = 12;
    NetworkDnsQuery network_dns_query = 13;
    NetworkDnsResponse network_dns_response = 14;
  }
}

message KubernetesAttribution {
  string project_id = 1;
  string application_id = 2;
  string node_name = 3;
  string namespace = 4;
  string pod_uid = 5;
  string pod_name = 6;
  string container_id = 7;
  string container_name = 8;
  string workload_uid = 9;
  string workload_kind = 10;
  string workload_name = 11;
  optional string release = 12;
}

message ProcessIdentity {
  uint64 cgroup_id = 1;
  uint32 pid = 2;
  uint32 tgid = 3;
  string command = 4;
}

message ProcessExec {
  string executable = 1;
  string parent_command = 2;
}

message Syscall {
  string name = 1;
}

message NetworkConnect {
  NetworkAddressFamily address_family = 1;
  bytes destination_address = 2;
  uint32 destination_port = 3;
  NetworkConnectOutcome outcome = 4;
  optional uint32 errno = 5;
  DnsContext dns_context = 6;
}

message NetworkDnsQuery {
  uint32 transaction_id = 1;
  DnsDirection direction = 2;
  DnsTransport transport = 3;
  bytes resolver_address = 4;
  string name = 5;
  DnsQueryType query_type = 6;
}

message NetworkDnsResponse {
  uint32 transaction_id = 1;
  DnsDirection direction = 2;
  DnsTransport transport = 3;
  bytes resolver_address = 4;
  string name = 5;
  DnsQueryType query_type = 6;
  DnsResponseCode response_code = 7;
  bool truncated = 8;
  repeated DnsAddressAnswer answers = 9;
  repeated DnsCname cname_chain = 10;
  optional uint32 effective_ttl_seconds = 11;
}

message DnsAddressAnswer {
  string name = 1;
  bytes address = 2;
  uint32 ttl_seconds = 3;
}

message DnsCname {
  string alias = 1;
  string canonical = 2;
  uint32 ttl_seconds = 3;
}

message DnsContext {
  repeated string names = 1;
  int64 observed_at_unix_nanos = 2;
  int64 expires_at_unix_nanos = 3;
  DnsConfidence confidence = 4;
  bool ambiguous = 5;
}

enum DnsQueryType {
  DNS_QUERY_TYPE_UNSPECIFIED = 0;
  DNS_QUERY_TYPE_A = 1;
  DNS_QUERY_TYPE_AAAA = 2;
}

enum DnsTransport {
  DNS_TRANSPORT_UNSPECIFIED = 0;
  DNS_TRANSPORT_UDP = 1;
  DNS_TRANSPORT_TCP = 2;
}

enum DnsDirection {
  DNS_DIRECTION_UNSPECIFIED = 0;
  DNS_DIRECTION_EGRESS = 1;
  DNS_DIRECTION_INGRESS = 2;
}

enum DnsResponseCode {
  DNS_RESPONSE_CODE_UNSPECIFIED = 0;
  DNS_RESPONSE_CODE_NO_ERROR = 1;
  DNS_RESPONSE_CODE_FORM_ERR = 2;
  DNS_RESPONSE_CODE_SERV_FAIL = 3;
  DNS_RESPONSE_CODE_NX_DOMAIN = 4;
  DNS_RESPONSE_CODE_NOT_IMP = 5;
  DNS_RESPONSE_CODE_REFUSED = 6;
}

enum DnsConfidence {
  DNS_CONFIDENCE_UNSPECIFIED = 0;
  DNS_CONFIDENCE_OBSERVED_RECENTLY = 1;
}

enum NetworkAddressFamily {
  NETWORK_ADDRESS_FAMILY_UNSPECIFIED = 0;
  NETWORK_ADDRESS_FAMILY_IPV4 = 1;
  NETWORK_ADDRESS_FAMILY_IPV6 = 2;
}

enum NetworkConnectOutcome {
  NETWORK_CONNECT_OUTCOME_UNSPECIFIED = 0;
  NETWORK_CONNECT_OUTCOME_SUCCEEDED = 1;
  NETWORK_CONNECT_OUTCOME_IN_PROGRESS = 2;
  NETWORK_CONNECT_OUTCOME_FAILED = 3;
}

message DropCounters {
  uint64 filtered = 1;
  uint64 unattributed = 2;
  uint64 unsupported = 3;
  uint64 decode_failed = 4;
  uint64 capacity = 5;
  uint64 kernel_lost = 6;
  uint64 connect_correlation_capacity = 7;
  uint64 connect_correlation_miss = 8;
  uint64 connect_decode_failed = 9;
  uint64 connect_unsupported_family = 10;
  uint64 connect_kernel_lost = 11;
  uint64 dns_packet_decode_failed = 12;
  uint64 dns_malformed_compression = 13;
  uint64 dns_truncated = 14;
  uint64 dns_unsupported_record = 15;
  uint64 dns_correlation_miss = 16;
  uint64 dns_correlation_capacity = 17;
  uint64 dns_tcp_reassembly = 18;
  uint64 dns_rate_limited = 19;
  uint64 dns_capacity = 20;
  uint64 dns_kernel_lost = 21;
  uint64 dns_kernel_unsupported_framing = 22;
  uint64 dns_attribution_failed = 23;
  uint64 dns_oversize = 24;
}

message ControlMessage {
  string request_id = 1;
  oneof command {
    Ping ping = 10;
  }
}

message Ping {}

message ControlResult {
  string request_id = 1;
  ControlStatus status = 2;
  string detail = 3;
}

enum ControlStatus {
  CONTROL_STATUS_UNSPECIFIED = 0;
  CONTROL_STATUS_APPLIED = 1;
  CONTROL_STATUS_UNSUPPORTED = 2;
  CONTROL_STATUS_REJECTED = 3;
}
