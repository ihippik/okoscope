apiVersion: apps/v1
kind: Deployment
metadata:
  name: okoscope-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: okoscope-server
  template:
    metadata:
      labels:
        app: okoscope-server
        app.kubernetes.io/name: okoscope-server
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/ihippik/okoscope-server:0000000000000000000000000000000000000000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - configMapRef:
                name: okoscope-server
          env:
            - name: OKOSCOPE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: database-url}
            - name: OKOSCOPE_CLUSTER_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: cluster-credential}
            - name: OKOSCOPE_API_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: api-credential}
            - name: OKOSCOPE_WEBHOOK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: webhook-encryption-key}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: health, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: health}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: okoscope-server
spec:
  selector:
    app: okoscope-server
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: health, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: okoscope-server
data:
  OKOSCOPE_MIGRATE: "false"
  OKOSCOPE_DEVELOPMENT_PLAINTEXT: "true"
  OKOSCOPE_NOTIFICATION_DELIVERY_ENABLED: "false"
  OKOSCOPE_NOTIFICATION_CONCURRENCY: "8"
  OKOSCOPE_WEBHOOK_TIMEOUT_SECONDS: "10"
  RUST_LOG: info
