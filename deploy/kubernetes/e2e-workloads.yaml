apiVersion: v1
kind: Namespace
metadata: {name: okoscope-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: okoscope-demo
  labels: {app: payment-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-api}}
  template:
    metadata: {labels: {app: payment-api}}
    spec:
      containers:
        - name: payment-api
          image: busybox:1.37
          command: [sleep, infinity]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: okoscope-demo
  labels: {app: control-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: control-api}}
  template:
    metadata: {labels: {app: control-api}}
    spec:
      containers:
        - name: control-api
          image: busybox:1.37
          command: [sleep, infinity]
