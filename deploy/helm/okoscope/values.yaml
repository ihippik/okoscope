server:
  replicas: 1
  image: {repository: ghcr.io/ihippik/okoscope-server, tag: "0000000000000000000000000000000000000000", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  # Create the first owner through an internal port-forward, then disable registration.
  registrationEnabled: true
  sessionLifetimeSeconds: 43200
web:
  replicas: 1
  image: {repository: ghcr.io/ihippik/okoscope-web, tag: "0000000000000000000000000000000000000000", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
database:
  existingSecret: okoscope-database
  urlKey: database-url
internalSecret:
  existingSecret: ""
  adminCredentialKey: admin-credential
  webhookEncryptionKey: webhook-encryption-key
  identityTokenKey: identity-token-key
migration:
  backoffLimit: 2
  activeDeadlineSeconds: 300
notifications:
  enabled: false
  pollMilliseconds: 1000
  claimSize: 50
  concurrency: 8
  leaseSeconds: 30
  drainSeconds: 15
ingress:
  web:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tlsSecret: ""
  grpc:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tlsSecret: ""
certManager:
  enabled: false
  clusterIssuer: ""
imagePullSecrets: []
podDisruptionBudget:
  enabled: true
  minAvailable: 1
okoscope-agent:
  enabled: false
