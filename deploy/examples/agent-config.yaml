apiVersion: v1
kind: ConfigMap
metadata:
  name: okoscope-agent
  namespace: okoscope
data:
  agent.yaml: |
    apiVersion: okoscope.io/v1alpha1
    kind: AgentConfiguration
    server:
      endpoint: https://okoscope-server.okoscope.svc:4317
      credentialFile: /var/run/secrets/okoscope/credential
      caFile: /var/run/secrets/okoscope/ca.crt
    identity:
      nodeName: ${NODE_NAME}
      clusterName: local
    scope:
      workloads:
        - projectId: 018f4f9c-3f9a-7de1-8000-000000000001
          applicationId: 018f4f9c-3f9a-7de1-8000-000000000002
          namespace: production
          kind: Deployment
          name: payment-api
          # release: 1.7.2 # Optional; create the release through the server API first.
          labels:
            app.kubernetes.io/name: payment-api
    observation:
      processExec: true
      syscalls:
        - ptrace
        - setns
      network:
        connect: false
    safety:
      queueCapacity: 4096
      batchSize: 256
      maxEventsPerSecond: 10000
