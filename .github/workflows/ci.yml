name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude agent-ebpf --all-targets -- -D warnings
      - run: cargo test --workspace --exclude agent-ebpf
      - run: cargo check -p protocol

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: okoscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/okoscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p server --test migrations -- --ignored

  deployment-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Run release policy and secret regression tests
        run: make deployment-test
      - name: Install pinned kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - name: Validate supported Kubernetes overlays
        run: |
          work=$(mktemp -d)
          kubectl kustomize deploy/kubernetes/install/bundled-postgres > "$work/install.yaml"
          kubectl kustomize deploy/kubernetes/migrate > "$work/migrate.yaml"
          kubectl kustomize deploy/kubernetes/overlays/production > "$work/production.yaml"
          kubectl kustomize deploy/kubernetes/overlays/external-postgres > "$work/external.yaml"
          kubectl kustomize deploy/kubernetes/overlays/development > "$work/development.yaml"
          kubectl kustomize deploy/kubernetes/routing > "$work/routing.yaml"
          kubeconform -strict -summary "$work/install.yaml" "$work/migrate.yaml" \
            "$work/production.yaml" "$work/external.yaml" "$work/development.yaml"
          kubeconform -strict -ignore-missing-schemas -summary "$work/routing.yaml"

  image-build:
    needs: userspace
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agent
            dockerfile: Dockerfile.agent
            architecture: amd64
            runner: ubuntu-24.04
          - component: server
            dockerfile: Dockerfile.server
            architecture: amd64
            runner: ubuntu-24.04
          - component: agent
            dockerfile: Dockerfile.agent
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: server
            dockerfile: Dockerfile.server
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          build-args: |
            OKOSCOPE_GIT_COMMIT=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}

  image-index:
    if: github.event_name != 'pull_request'
    needs: image-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [agent, server]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate multi-platform image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Publish multi-platform image index
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          SOURCE_TAG: ${{ github.sha }}
          OUTPUT_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$OUTPUT_TAGS"
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$SOURCE_TAG-amd64" \
            "$IMAGE:$SOURCE_TAG-arm64"

  deployment-manifest:
    if: github.event_name != 'pull_request'
    needs: [userspace, postgres-migrations, deployment-validation, image-index]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render immutable release bundle
        env:
          WEB_IMAGE: ${{ vars.OKOSCOPE_WEB_IMAGE || 'ghcr.io/ihippik/okoscope-web:0df87f703f3f1801590a6ec7ad73dae9ad487f87' }}
          OKOSCOPE_DOMAIN: okoscope.com
          OKOSCOPE_CERT_ISSUER: letsencrypt-production
          OKOSCOPE_TLS_SECRET: okoscope-com-tls
          OKOSCOPE_HTTP_ENTRYPOINT: web
          OKOSCOPE_HTTPS_ENTRYPOINT: websecure
          OKOSCOPE_SERVER_SERVICE: okoscope-server
          OKOSCOPE_WEB_SERVICE: okoscope-web
        run: |
          deploy/scripts/render-release.sh release \
            "${{ github.sha }}" "${{ github.sha }}" "$WEB_IMAGE" enabled
          deploy/tests/manifest-policy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: okoscope-kubernetes-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
