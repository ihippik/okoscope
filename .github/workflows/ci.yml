name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude agent-ebpf --all-targets -- -D warnings
      - run: cargo test --workspace --exclude agent-ebpf
      - run: cargo check -p protocol

  images:
    needs: userspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agent
            dockerfile: Dockerfile.agent
          - component: server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deployment-manifest:
    if: github.event_name != 'pull_request'
    needs: [userspace, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render immutable GHCR image references
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed \
            -e "s#image: okoscope/server:dev#image: ${IMAGE_PREFIX}-server:${IMAGE_TAG}#" \
            -e "s#image: okoscope/agent:dev#image: ${IMAGE_PREFIX}-agent:${IMAGE_TAG}#" \
            deploy/kubernetes/mvp.yaml > okoscope-mvp.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: okoscope-mvp-${{ github.sha }}
          path: okoscope-mvp.yaml
          if-no-files-found: error
          retention-days: 30
